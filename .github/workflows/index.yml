name: Update post index
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build index.json
        run: |
          ls posts/*.md | xargs -n1 basename | sed 's/\.md$//' | jq -R . | jq -s . > posts/index.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add greencrew/blog/index.json
          git diff --staged --quiet || (git commit -m "Update post index" && git push)
